fast_lio_localization_sc_qn:
  ros__parameters:
    topics:
      odom: /Odometry
      cloud: /cloud_registered
      global_odom: /r2/global_odometry
      current_pose: /r2_current_pose
      saved_map: /r2/localization/saved_map
      corrected_cloud: /r2/localization/corrected_cloud
      debug_source: /r2/localization/src
      debug_target: /r2/localization/dst
      debug_coarse: /r2/localization/coarse_aligned
      debug_final: /r2/localization/final_aligned
      match_marker: /r2/localization/matches
    frames:
      map: map
      child: body
    map:
      # r2_sam_keyframe_map_v1 地图目录，内部包含 poses.csv 和 keyframes/*.pcd。
      # 该目录由 /r2/sam/save_map 服务从 SAM 后端直接导出。
      directory: ""
      visualize_voxel_size: 1.0
    sync:
      queue_size: 30
      max_stamp_diff_sec: 0.03
      qos_reliability: reliable
    cold_start:
      # 融合静止窗口内的多帧扫描，减少 Mid-360 扫描稀疏和动态遮挡影响。
      # 师兄原版依赖移动关键帧；这里保留静态冷启动，但减至 10 帧以接近单关键帧密度。
      accumulation_frames: 10
      max_attempts: 6
      use_position_prior: false
      expected_x_mm: 0.0
      expected_y_mm: 0.0
      position_tolerance_m: 2.0
    keyframe:
      distance_threshold: 1.5
      min_points: 80
    match:
      timer_hz: 2.0
      enable_quatro: true
      # 纯全局重定位时建议 false；如果已有靠谱初值，可设 true 限制候选距离。
      enable_distance_gate: false
      # 当前定位实现会无条件拼目标子图；设为 0 才等价于师兄 Quatro 的单候选关键帧。
      num_submap_keyframes: 0
      scancontext_num_candidates: 5
      # 大场地粗特征尺度：与 0.90/1.50 m FPFH 半径及 0.30 m noise bound 成套使用。
      voxel_resolution: 0.30
      scancontext_max_correspondence_distance: 35.0
      scancontext_distance_threshold: 0.40
      overlap_max_distance: 0.60
      min_overlap_ratio: 0.30
    nano_gicp:
      thread_number: 0
      correspondences_number: 15
      max_iterations: 32
      ransac_iterations: 5
      max_correspondence_distance: 35.0
      fitness_score_threshold: 1.5
      transformation_epsilon: 0.01
      euclidean_fitness_epsilon: 0.01
      ransac_outlier_rejection_threshold: 1.0
    quatro:
      use_optimized_matching: true
      estimate_scale: false
      max_correspondences: 500
      max_iterations: 50
      distance_threshold: 35.0
      fpfh_normal_radius: 0.90
      fpfh_radius: 1.50
      noise_bound: 0.30
      rotation_gnc_factor: 1.40
      rotation_cost_diff_threshold: 0.0001
